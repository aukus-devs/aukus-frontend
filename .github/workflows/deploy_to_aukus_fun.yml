name: Deploy to aukus.fun

on:
  workflow_call:
    secrets:
      host:
        description: "Host for SSH"
      username:
        description: "Username for SSH"
      password:
        description: "Password for SSH"
      port:
        description: "Port for SSH"
      webhook_url:
        description: "Discord webhook URL"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install
      - run: npm run build --if-present

      - name: copy file via ssh password
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.host }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}
          port: ${{ secrets.port }}
          source: './dist/'
          target: '/home/aukus/deploy/frontend/2025/deploy_build'

      - name: swap build and restart nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.host }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}
          port: ${{ secrets.port }}
          command_timeout: 1m
          script: cd "/home/aukus/deploy/frontend/2025" && rm -rf build && mkdir build && mv deploy_build/dist/* ./build/ && rm -r deploy_build/dist

      - name: Aukus v2025 prod frontend build and upload success!
        uses: rjstone/discord-webhook-notify@v1
        if: success()
        with:
          severity: info
          details: Aukus v2025 prod frontend deploy to aukus.fun success!
          webhookUrl: ${{ secrets.webhook_url }}

      - name: Aukus v2025 prod frontend build and upload failure!
        uses: rjstone/discord-webhook-notify@v1
        if: failure()
        with:
          severity: error
          details: Aukus v2025 prod frontend deploy to aukus.fun failure!
          webhookUrl: ${{ secrets.webhook_url }}
