name: Build frontend v2025

on:
  push:
    branches: ['v2025-prod']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install
      - run: npm run build --if-present

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: ./dist

      - name: Aukus v2025 prod frontend build failure!
        uses: rjstone/discord-webhook-notify@v1
        if: failure()
        with:
          severity: error
          details: Aukus v2025 prod frontend build failure!
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}

  call-deploy-to-aukus-fun:
    needs: build
    uses: ./.github/workflows/deploy_to_aukus_fun.yml
    secrets:
      host: ${{ secrets.HOST_AUKUS_FUN }}
      username: ${{ secrets.USERNAME }}
      password: ${{ secrets.PASSWORD }}
      port: ${{ secrets.PORT }}
      webhook_url: ${{ secrets.DISCORD_WEBHOOK }}

  call-deploy-to-aukus-su:
    needs: build
    uses: ./.github/workflows/deploy_to_aukus_su.yml
    secrets:
      host: ${{ secrets.HOST_AUKUS_SU }}
      username: ${{ secrets.USERNAME }}
      password: ${{ secrets.PASSWORD }}
      port: ${{ secrets.PORT }}
      webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
